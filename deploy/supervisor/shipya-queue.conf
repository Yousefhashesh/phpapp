[program:shipya-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/phpapp/artisan queue:work database --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/phpapp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/shipya-queue.log
